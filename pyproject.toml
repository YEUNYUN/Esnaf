[project]
name = "esnaf"
version = "0.1.0"
description = "Regime-aware autonomous crypto trading agent powered by LLM reasoning"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # Agent framework
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",

    # LLM routing
    "litellm>=1.60.0",

    # Exchange connectivity
    "ccxt>=4.4.0",

    # Data & indicators
    "pandas>=2.2.0",
    "pandas-ta>=0.4.0",
    "numpy>=1.26.0",

    # Schema validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # Database
    "aiosqlite>=0.21.0",

    # Scheduling
    "apscheduler>=3.10.0",

    # HTTP
    "httpx>=0.28.0",
    "aiohttp>=3.11.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff==0.15.8",
    "mypy>=1.14.0",
]
dashboard = [
    "streamlit>=1.41.0",
    "plotly>=5.24.0",
]
backtest = [
    "vectorbt>=0.26.0",
]

[project.scripts]
esnaf = "src.main:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
